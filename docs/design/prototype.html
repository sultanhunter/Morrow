function render(){const focusId=document.activeElement?.id;const restricted=['session','revoked'].includes(state.scenario);document.getElementById('sidebar').innerHTML=restricted?'<div class="brand"><span class="brand-mark">m</span>Morrow</div>':sidebar();document.getElementById('main-content').innerHTML=restricted?recoveryScreen():globalScope()+({work,home,inbox,agents,agent_store:agentStore,builder,assets,knowledge,settings,connections,ask}[state.page]||home)();document.getElementById('demo-role').value=state.role;document.getElementById('demo-state').value=state.scenario;if(focusId&&!document.getElementById('dialog').open)document.getElementById(focusId)?.focus({preventScroll:true});}
function toast(message){const node=document.getElementById('toast');node.textContent=message;node.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.hidden=true,6000);}
function closeNavigation(){const side=document.getElementById('sidebar');side.classList.remove('open');side.removeAttribute('role');side.removeAttribute('aria-modal');document.getElementById('main-content').inert=false;document.querySelector('.prototype-bar').inert=false;}
const currentPath=()=>state.page==='work'?paths.work+'/artifacts/'+state.tab:paths[state.page];
const linkedLocation=()=>{const artifact=location.hash.match(/^#\/w\/demo\/work\/autumn\/artifacts\/(brief|products|creative|results)$/);return artifact?{page:'work',tab:artifact[1]}:{page:Object.keys(paths).find(p=>location.hash==='#'+paths[p]),tab:null};};
function updateArtifactRoute(){if(state.page==='work')history.replaceState(null,'','#'+currentPath());}
function navigate(page){state.page=page;state.pane='artifact';history.pushState(null,'','#'+currentPath());render();closeNavigation();document.getElementById('main-content').focus({preventScroll:true});}
function protect(next){if(state.dirty){pendingNavigation=next;openDialog('unsaved');}else next();}
function save(){if(state.scenario==='save-error'){toast('The simulated save failed. Your unsaved text is preserved.');return false;}if(state.scenario==='offline'){toast('Reconnect before saving. Your local edits are preserved.');return false;}if(state.scenario==='conflict'){openDialog('conflict');return false;}savedBrief=state.draft;state.dirty=false;state.revision++;state.approved=false;state.approvedItems=[];state.reviewConfirmed=false;try{localStorage.setItem('morrow-prototype-brief-v1',JSON.stringify({text:savedBrief,revision:state.revision}));}catch{toast('Storage is unavailable. This prototype draft lasts only until you close the page.');render();return true;}state.activity.unshift('A new brief draft was saved. Previous approval no longer applies.');render();toast('Draft saved in this prototype. No store change was made.');return true;}
function discard(){state.draft=savedBrief;state.dirty=false;render();}
function modal(title,subtitle,body,footer=''){return `<div class="dialog-head"><div><h2 id="dialog-title" tabindex="-1">${title}</h2><p class="muted">${subtitle}</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;}
function reviewDialog(){if(['uncertain','cancelled'].includes(state.scenario))return modal('Reconcile the existing operation first','Main store · submitted work has not been verified','<p>A new approval must wait until the existing submitted change is reconciled. Cancelling future work does not undo or repeat a provider effect.</p>','<button data-action="close-dialog">Close</button><button data-action="evidence">Inspect existing operation</button>');if(state.approved)return modal('Recorded approval',`Main store · Draft v${state.revision} · ${state.approvedItems.length} selected changes`,`<p>The approved items are: ${state.approvedItems.map(i=>esc(products[i].title)).join(', ')}.</p><p>Maximum ${state.approvedItems.length*10} work credits. Other items remain draft. Approval does not prove publication.</p>`,'<button data-action="close-dialog">Close</button>');const count=state.selectedProducts.length,stale=state.scenario==='stale';return modal('Review product changes',`Autumn collection · Main store · Draft v${state.revision}`,`${stale?'<div class="notice" style="margin:0 0 16px"><div><strong>The previous approval expired</strong><p>Refresh the current source before recording a new approval.</p></div></div>':''}<p>Approve only the selected title changes. Approval does not itself publish anything.</p>${products.map((p,i)=>`<div class="checkbox-row"><input type="checkbox" id="review-item-${i}" data-review-index="${i}" ${state.selectedProducts.includes(i)?'checked':''} ${stale?'disabled':''}><label for="review-item-${i}"><strong>${p.title}</strong></label></div><div class="comparison"><div><small class="muted">Current</small><p>${p.before}</p></div><div class="after"><small class="muted">Proposed draft</small><p>${p.after}</p></div></div>`).join('')}<div class="review-summary"><strong id="review-target">Main store · ${count} product${count===1?'':'s'}</strong><span id="review-budget">Maximum ${count*10} work credits</span></div><p class="small muted">Sample ceiling only; real rates are not activated. No prices, inventory or advertising spend are changed.</p>${!canReview()?'<div class="notice info" style="margin:16px 0 0"><div><strong>Maya Chen is the assigned reviewer</strong><p>Your specialist role cannot approve this proposal.</p></div></div>':`<div class="checkbox-row"><input type="checkbox" id="review-confirm" ${state.reviewConfirmed?'checked':''} ${stale?'disabled':''}><label for="review-confirm">I reviewed the selected changes for <strong>Main store</strong> and their stated ceiling.</label></div>`}`,stale?'<button data-action="close-dialog">Close</button><button class="primary" data-action="refresh-review">Refresh comparison</button>':!canReview()?'<button data-action="close-dialog">Close</button><button data-action="request-review">Request Maya’s review</button>':`<button data-action="close-dialog">Keep draft</button><button class="primary" id="approve-button" data-action="approve" ${!state.reviewConfirmed||count===0?'disabled':''}>Approve ${count} changes</button>`);}
function openDialog(kind,title){currentDialog=kind;lastOpener=document.activeElement;const d=document.getElementById('dialog');let html='';
if(kind==='review'){state.reviewConfirmed=false;html=reviewDialog();}
else if(kind==='unsaved')html=modal('Keep your draft before leaving','Autumn collection · Main store',`<p>Your launch instructions have unsaved edits. Save them as a new draft, discard them, or keep working here.</p>${state.scenario==='offline'?'<p class="muted" style="margin-top:12px">You are offline. Saving is unavailable; stay to preserve local work.</p>':''}`,`<button data-action="stay">Keep editing</button><button data-action="discard-leave">Discard and leave</button><button class="primary" data-action="save-leave" ${['offline','conflict'].includes(state.scenario)?'disabled':''}>Save draft and leave</button>`);
else if(kind==='question')html=modal('Confirm the linen source','Question · asked of Maya Chen · Main store',state.questionAnswered?'<p>The answer is saved to the project: use the approved linen notes and verify each factual product claim before publication.</p>':`<p>Which source should the SEO Analyst use for factual product details?</p><div class="field"><label for="source-answer">Answer</label><select id="source-answer"><option value="approved">Use the approved linen notes</option><option value="missing">The source is missing; keep the task waiting</option></select></div><div class="field"><label for="question-note">Optional explanation</label><textarea id="question-note" placeholder="Add relevant context…" maxlength="1000"></textarea></div><p class="small muted" style="margin-top:12px">Answering does not approve or publish a product change.</p>`,state.questionAnswered?'<button data-action="close-dialog">Close</button>':`<button data-action="close-dialog">Later</button><button class="primary" data-action="answer" ${state.role!=='owner'?'disabled':''}>Save answer</button>`);
else if(kind==='conflict')html=modal('Compare brief versions','Your local draft is preserved · Main store',`<div class="comparison"><div><strong>Your draft</strong><p>${esc(state.draft)}</p></div><div class="after"><strong>Maya’s newer version</strong><p>Prepare the collection for launch next Thursday. Confirm the care guidance before publication.</p></div></div><p>Keep your version as a new draft. The other revision remains in version history.</p>`,'<button data-action="close-dialog">Keep comparing</button><button class="primary" data-action="resolve-conflict">Keep mine as a new draft</button>');
else if(kind==='evidence')html=modal('Operation evidence','Sample operation · Main store · no live execution',`<h3>${state.scenario==='partial'?'Item results':'A provider outcome needs verification'}</h3><p style="margin-top:12px">${state.scenario==='partial'?'Linen Shirt: verified sample success. Utility Overshirt: verified sample success. Everyday Tote: rejected; review a refreshed comparison.':'A request was submitted, but its response is unknown. A repeated publish could duplicate an effect. The operation stays pending while provider readback is checked.'}</p><div class="objective"><strong>Next owner: connection worker</strong><p>Reconcile the existing operation. Submitted liabilities remain held until usage and effect evidence are known.</p></div>`,'<button data-action="close-dialog">Close</button>');
else if(kind==='connector')html=modal('Shopify connector preview','Main store · minimal connection surface',`<div class="connector-page"><div class="brand" style="padding:0"><span class="brand-mark">m</span>Morrow</div><h1 style="margin-top:24px">Shopify connection</h1><p><strong>Linen &amp; Form · Main store</strong></p>${tag(isDisconnected()?'Needs reconnect':'Linked to Morrow',isDisconnected()?'warning':'success')}<p class="muted">Only connection status, verified linking and recovery controls belong here. Work continues in Morrow.</p><div class="connector-controls"><button class="primary" data-action="simulate-reconnect">${isDisconnected()?'Preview verified reconnect':'Return to Morrow'}</button><button data-action="disconnect">Disconnect store</button></div><small class="muted">Design preview; this does not open OAuth or change an installation.</small></div>`);
else if(kind==='disconnect')html=modal('Disconnect Main store?','Connection removal is separate from subscription cancellation','<p>New store work stops and access is revoked. Other stores remain connected. Submitted operations and valid usage still need reconciliation.</p>','<button data-action="close-dialog">Keep connection</button><button data-action="confirm-disconnect">Preview disconnect</button>');
else if(kind==='listing')html=modal(esc(title||'Agent release'),'Example first-party release · not a qualified installation',`<p>Inspect skills, sources, connectors, authority, expected work and sample results before installation.</p><div class="objective"><strong>Missing connection: Meta Ads, when advertising is requested</strong><p>Installing a title does not grant account access or spending permission.</p></div><div class="card"><h3>Bounded sample</h3><p>A draft plan with source references and a review question. No publication, schedule or spend is activated.</p></div>`,'<button data-action="close-dialog">Close</button><button data-action="builder-from-listing">Configure a draft</button>');
else if(kind==='image-review')html=modal('Review image choice','Linen Shirt · Main store · sample illustration',`<p>${state.selectedImages.length} draft choice selected. Compare against the approved product reference for shape, color, material, logo and variant.</p><div class="objective"><strong>Fidelity review is required</strong><p>This prototype illustration is not a product photo or evidence of fidelity.</p></div>`,'<button data-action="close-dialog">Keep reviewing</button><button data-action="choose-image">Save choice as draft</button>');
else if(kind==='activity')html=modal('Project activity','Autumn collection · Main store',resultsTab(),'<button data-action="close-dialog">Close</button>');
else if(kind==='team')html=modal('People and agents','Autumn collection · visible project membership','<div class="list-item"><div><strong>Maya Chen · Human</strong><p>Owner and assigned reviewer</p></div></div><div class="list-item"><div><strong>Leo Martin · Human</strong><p>SEO specialist · cannot approve this proposal</p></div></div><div class="list-item"><div><strong>SEO Analyst · Agent</strong><p>Research and drafts only · no publication authority</p></div></div>','<button data-action="close-dialog">Close</button>');
else if(kind==='agent-details')html=modal('Agent scope','Example installation · Main store','<p>Allowed: inspect authorized product sources, research and prepare drafts.</p><p>Requires human review: exact publication proposals. Not allowed: refunds, ad spend, unrelated store data or changing its own permissions.</p>','<button data-action="close-dialog">Close</button>');
else if(kind==='source')html=modal('Approved linen notes','Sample merchant source · observed 6 October 2026','<p>Authority: merchant-approved source. Exact product composition and care claims must match the relevant approved evidence.</p><p>Freshness and access are checked before use. A model-generated statement is not an authoritative product fact.</p>','<button data-action="close-dialog">Close</button>');
else if(kind==='meta-setup')html=modal('Connect Meta Ads','Setup requirements · no external connection started','<p>An eligible account owner connects Meta and selects permitted ad accounts. Report access and campaign/spend permission are distinct.</p><p>Until provider/account access and current spend review qualify, campaign activation stays unavailable.</p>','<button data-action="close-dialog">Close</button><button data-action="builder-from-listing">Save agent setup draft</button>');
else if(kind==='spend-settings')html=modal('Additional work spending','Main store · automatic top-ups are off','<p>Extra paid work requires an explicit purchase or an owner-authorized capped mandate. The ceiling applies to all child agents and paid retries.</p><p>Plans, rates and purchase controls are not activated in this design prototype.</p>','<button data-action="close-dialog">Close</button>');
else if(kind==='export')html=modal('Authorized export preview','Main store · ordinary granted access','<p>Collection brief, your permitted draft revisions and source references are available under the current access rules. Credit exhaustion does not revoke export or privacy handling.</p>','<button data-action="close-dialog">Close</button>');
else if(kind==='new-project')html=modal('Create a project','Purpose and store scope before agent work','<div class="field"><label for="project-name">Project name</label><input id="project-name" value="Autumn collection"></div><p class="muted" style="margin-top:12px">Target: Main store. Creating a draft project does not start paid work.</p>','<button data-action="close-dialog">Cancel</button><button data-action="sample-project">Open sample project</button>');
else if(kind==='search')html=modal('Search workspace','Only permitted records appear','<div class="field"><label for="search-input">Search</label><input id="search-input" placeholder="Autumn collection"></div><div class="card"><strong>Autumn collection</strong><p>Main store · current sample project</p><button data-action="sample-project">Open project</button></div>','<button data-action="close-dialog">Close</button>');
else if(kind==='objective')html=modal('Preview scoped work','Coordinator request · Main store','<p>The coordinator links your objective to a task, asks for missing product evidence and proposes a qualified specialist. No actual agent is running here.</p>','<button data-action="close-dialog">Keep editing</button><button data-action="sample-project">Inspect sample task</button>');
d.innerHTML=html;if(!d.open)d.showModal();document.getElementById('dialog-title')?.focus({preventScroll:true});}
function closeDialog(){document.getElementById('dialog').close();currentDialog=null;if(lastOpener?.isConnected&&lastOpener.getClientRects().length)lastOpener.focus({preventScroll:true});else document.getElementById('main-content').focus({preventScroll:true});}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();document.getElementById('main-content').focus();return;}const node=e.target.closest('[data-action],[data-page]');if(!node)return;e.preventDefault();if(node.disabled)return;if(node.dataset.page){protect(()=>navigate(node.dataset.page));return;}const action=node.dataset.action;
if(action==='close-dialog'||action==='stay'){pendingNavigation=null;closeDialog();}
else if(action==='open-nav'){const side=document.getElementById('sidebar');side.classList.add('open');side.setAttribute('role','dialog');side.setAttribute('aria-modal','true');document.getElementById('main-content').inert=true;document.querySelector('.prototype-bar').inert=true;document.querySelector('[data-action="close-nav"]').focus();}
else if(action==='close-nav'){closeNavigation();document.querySelector('[data-action="open-nav"]').focus();}
else if(action==='tab'){state.tab=node.dataset.tab;state.pane='artifact';updateArtifactRoute();render();document.getElementById('tab-'+state.tab).focus();}
else if(action==='pane'){state.pane=node.dataset.pane;render();document.querySelector(`[data-pane="${state.pane}"]`)?.focus();}
else if(action==='products-tab'||action==='creative-tab'){state.tab=action==='products-tab'?'products':'creative';state.pane='artifact';updateArtifactRoute();render();document.getElementById('tab-'+state.tab).focus();}
else if(action==='save')save();else if(action==='discard')discard();
else if(action==='discard-leave'){const next=pendingNavigation;pendingNavigation=null;discard();closeDialog();next?.();}
else if(action==='save-leave'){const next=pendingNavigation;if(save()){pendingNavigation=null;closeDialog();next?.();}}
else if(action==='resolve-conflict'){state.scenario='ready';closeDialog();save();}
else if(action==='approve'){if(!canReview()||!state.reviewConfirmed||!state.selectedProducts.length||state.scenario==='stale')return;state.approved=true;state.approvedItems=[...state.selectedProducts];state.activity.unshift(`${state.selectedProducts.length} exact changes approved for Main store; publication is separate.`);closeDialog();render();toast('Approval recorded in the prototype. No changes were published.');}
else if(action==='refresh-review'){state.scenario='ready';state.revision++;state.approved=false;state.approvedItems=[];state.reviewConfirmed=false;render();document.getElementById('dialog').innerHTML=reviewDialog();document.getElementById('dialog-title').focus();}
else if(action==='answer'){if(state.role!=='owner')return;const answer=document.getElementById('source-answer').value;state.questionAnswered=answer==='approved';state.scenario=answer==='approved'?'ready':'question';closeDialog();render();toast(answer==='approved'?'Answer saved to the sample project. No change was approved.':'Task remains waiting for a source.');}
else if(action==='request-review'){closeDialog();toast('Review request added to the prototype inbox. No person was messaged.');}
else if(action==='select-image'){state.selectedImages=[Number(node.dataset.index)];render();document.querySelector(`[data-index="${node.dataset.index}"]`)?.focus();}
else if(action==='choose-image'){closeDialog();toast('Image choice saved as a draft in the prototype.');}
else if(action==='build-agent'){if(!state.builderPurpose.trim()){toast('Describe the outcome before choosing skills and connections.');document.getElementById('builder-purpose').focus();return;}state.builderAnswered=true;state.builderNeedsAds=/meta|ads|campaign/i.test(state.builderPurpose);render();document.getElementById('builder-reviewer').focus();}
else if(action==='save-agent'){state.builderSaved=true;render();toast('Agent draft saved in the prototype. No routine started.');}
else if(action==='builder-from-listing'){closeDialog();protect(()=>navigate('builder'));}
else if(action==='simulate-reconnect'){state.connection='connected';state.scenario='ready';closeDialog();render();toast('Reconnect state previewed. No OAuth or store connection changed.');}
else if(action==='confirm-disconnect'){state.connection='disconnected';closeDialog();render();toast('Disconnect state previewed. No live access was changed.');}
else if(action==='preview-signin'){state.scenario='ready';render();toast('Sign-in recovery previewed. Current permissions would be rechecked before real access.');}
else if(action==='switch-workspace'){toast('No other authorized workspace is present in this prototype.');}
else if(action==='retry-save'){state.scenario='ready';if(state.dirty)save();else render();}
else if(action==='usage'){protect(()=>navigate('settings'));}
else if(action==='sample-project'){closeDialog();state.scenario='ready';protect(()=>navigate('work'));}
else if(action==='keep-working'){document.getElementById('brief-notes')?.focus();}
else openDialog(action,node.dataset.title);
});
document.addEventListener('input',e=>{if(e.target.id==='brief-notes'){state.draft=e.target.value;const dirty=state.draft!==savedBrief;if(dirty!==state.dirty){const position=e.target.selectionStart;state.dirty=dirty;render();const field=document.getElementById('brief-notes');field.focus();field.setSelectionRange(position,position);}}if(e.target.id==='builder-purpose')state.builderPurpose=e.target.value;if(e.target.id==='conversation-input')state.conversationDraft=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='demo-role'){state.role=e.target.value;render();}if(e.target.id==='demo-state'){state.scenario=e.target.value;state.pane='artifact';render();}if(e.target.id==='store-filter'){const selected=e.target.value;protect(()=>{state.store=selected;render();toast('Navigation filter changed. The existing project still targets Main store.');});if(state.dirty)e.target.value=state.store;}
if(e.target.hasAttribute('data-review-index')){const i=Number(e.target.dataset.reviewIndex);state.selectedProducts=e.target.checked?[...new Set([...state.selectedProducts,i])]:state.selectedProducts.filter(x=>x!==i);state.reviewConfirmed=false;const count=state.selectedProducts.length;document.getElementById('review-target').textContent=`Main store · ${count} products`;document.getElementById('review-budget').textContent=`Maximum ${count*10} work credits`;const confirmed=document.getElementById('review-confirm');if(confirmed)confirmed.checked=false;const approve=document.getElementById('approve-button');if(approve){approve.textContent=`Approve ${count} changes`;approve.disabled=true;}}
if(e.target.id==='review-confirm'){state.reviewConfirmed=e.target.checked;document.getElementById('approve-button').disabled=!state.reviewConfirmed||!state.selectedProducts.length;}
});
document.addEventListener('submit',e=>{if(e.target.id==='message-form'){e.preventDefault();if(state.scenario==='exhausted'||!state.conversationDraft.trim())return;state.messages.push(state.conversationDraft.trim());state.conversationDraft='';render();toast('Scoped sample request saved. No agent was dispatched.');}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&document.getElementById('sidebar').classList.contains('open')){const controls=[...document.getElementById('sidebar').querySelectorAll('a[href],button:not([disabled])')].filter(n=>n.getClientRects().length);if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus();}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openDialog('search');}if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['brief','products','creative','results'];const i=tabs.indexOf(state.tab);state.tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[3]:tabs[(i+(e.key==='ArrowRight'?1:3))%4];state.pane='artifact';updateArtifactRoute();render();document.getElementById('tab-'+state.tab).focus();}if(e.key==='Escape'&&document.getElementById('sidebar').classList.contains('open')){closeNavigation();document.querySelector('[data-action="open-nav"]')?.focus();}});
document.getElementById('dialog').addEventListener('cancel',()=>{pendingNavigation=null;currentDialog=null;});
window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('popstate',()=>{const linked=linkedLocation(),page=linked.page;if(!page)return;if(state.dirty){history.replaceState(null,'','#'+currentPath());protect(()=>{if(linked.tab)state.tab=linked.tab;navigate(page);});}else{state.page=page;if(linked.tab)state.tab=linked.tab;render();}});
const linkedPage=linkedLocation();if(linkedPage.page){state.page=linkedPage.page;if(linkedPage.tab)state.tab=linkedPage.tab;}else history.replaceState(null,'','#'+currentPath());render();
</script>
</body></html>
