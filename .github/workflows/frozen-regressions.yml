name: Frozen WorkOS regressions (archive replay)
# Optional, manual replay of the frozen 71/74/75/80/82 WorkOS operator
# regressions retired by ADR-0013. It checks out the archive tag, never the
# current tree, and uses the archived sources and lockfile. It is not a
# required check. The replays rewrite the tracked reports of that tree, so
# this job has no clean-tree gate. The uploaded paths are tracked at the tag,
# so a report that a failed replay never rewrote would still be present: the
# upload therefore runs only when every replay, the unit tests and the archived
# repository secret scan succeeded.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex-archive-f89ad75
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the archived locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay preserved75 session observation with synthetic providers only
        run: npm run lab:workos-session-status-frozen75
      - name: Replay isolated71 WorkOS operator with SQL and loopback only
        run: npm run lab:workos-operator
      - name: Replay preserved74 WorkOS signature operator with synthetic providers only
        run: npm run lab:workos-operator-frozen74
      - name: Replay preserved80 full authentication operator with synthetic providers only
        run: npm run lab:workos-authentication-operator
      - name: Replay preserved82 full authentication operator with synthetic providers only
        run: npm run lab:workos-authentication-operator-frozen82
      - name: Run the frozen regression and identity77 archive unit tests
        run: node --import tsx --test --test-concurrency=1 tests/workos-*regression*.test.mjs tests/workos-identity77-archive.test.mjs
      - name: Secret-scan the archived tree, including the regenerated reports
        id: report_scan
        if: always()
        run: npm run verify:delivery
      - name: Upload regenerated reports
        if: success() && steps.report_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-frozen-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/evidence/P05.T01e/frozen*.json
            docs/evidence/P05.T01g/frozen*.json
            docs/evidence/P05.T01h/frozen*.json
            docs/evidence/P05.T01o/frozen*.json
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
