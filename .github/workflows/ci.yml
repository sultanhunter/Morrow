name: Morrow foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Quarantine fixed reports before validation
        id: validation_evidence_prepare
        env:
          CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-validation-evidence.mjs prepare
      - name: Install locked dependencies
        id: install_dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full repository CI
        id: baseline_ci
        run: npm run ci
      - name: Run scaffold denial guards
        id: baseline_smoke
        run: npm run smoke:scaffold
      - name: Managed login native request lifetime
        id: workers_managed_login_lifetime
        run: npm run lab:managed-login-lifetime-workers
      - name: Exercise identity and validators in the local Workers runtime
        id: workers_identity
        run: npm run lab:workers
      - name: Exercise delegated and automation permissions in the local Workers runtime
        id: workers_agent
        run: npm run lab:agent-authority-workers
      - name: Exercise controlled workspace and store linking in the local Workers runtime
        id: workers_linking
        run: npm run lab:workspace-store-linking-workers
      - name: Exercise private PKCE and code admission in the local Workers runtime
        id: workers_pkce
        run: npm run lab:authentication-exchange-workers
      - name: Exercise offline session-token verification in the local Workers runtime
        id: workers_token
        run: npm run lab:workos-session-token-workers
      - name: Exercise bounded session observations in the local Workers runtime
        id: workers_status
        run: npm run lab:workos-session-status-workers
      - name: Exercise verified token and active-session composition in local Workers
        id: workers_evidence
        run: npm run lab:workos-authentication-evidence-workers
      - name: Exercise private provider identity and workspace selection in local Workers
        id: workers_selection
        run: npm run lab:workos-workspace-selection-workers
      - name: Exercise private local browser session admission in Workers
        id: workers_admission
        run: npm run lab:browser-session-admission-workers
      - name: Exercise browser cookie to workspace request authentication in Workers
        id: workers_workspace
        run: npm run lab:standalone-workspace-workers
      - name: Exercise authenticated controlled store linking in Workers
        id: workers_store
        run: npm run lab:standalone-store-linking-workers
      - name: Exercise initial login and cookie composition with synthetic providers in Workers
        id: workers_login
        run: npm run lab:standalone-login-workers
      - name: Exercise current browser-family logout with synthetic providers in Workers
        id: workers_logout
        run: npm run lab:standalone-logout-workers
      - name: Exercise fixed WorkOS wire adapter with synthetic providers in Workers
        id: workers_fixed_provider
        run: npm run lab:fixed-workos-login-workers
      - name: Exercise captured fixed WorkOS Fetch through the local Workers platform
        id: workers_platform_provider
        run: npm run lab:fixed-workos-platform-workers
      - name: Exercise controlled Neon profiles through native Workers WebSocket and PG wire
        id: workers_controlled_neon
        run: npm run lab:controlled-neon-workers
      - name: Exercise preserved75 session observation with synthetic providers only
        id: frozen75
        run: npm run lab:workos-session-status-frozen75
      - name: Record the isolated pinned PostgreSQL engine build
        id: sql_engine
        run: >-
          node --input-type=module --eval 'import {localPostgresLab} from "./scripts/local-postgres-lab.mjs"; await localPostgresLab("P04.engine-diagnostic", async ({image,version}) => console.log(JSON.stringify({image,version})));'
      - name: Exercise controlled Neon profiles and login against isolated PostgreSQL
        id: postgresql_controlled_neon
        run: npm run lab:controlled-neon-postgresql
      - name: Managed login cross-isolate PostgreSQL continuity
        id: postgresql_managed_login
        run: npm run lab:managed-login-postgresql
      - name: Exercise isolated PostgreSQL operations
        id: sql_operations
        run: npm run lab:operations
      - name: Exercise isolated PostgreSQL quarantined restore
        id: sql_restore
        run: npm run lab:restore
      - name: Exercise isolated PostgreSQL identity
        id: sql_identity
        run: npm run lab:identity
      - name: Exercise isolated PostgreSQL permissions
        id: sql_permissions
        run: npm run lab:permissions
      - name: Exercise isolated PostgreSQL authentication challenges
        id: sql_challenge
        run: npm run lab:authentication
      - name: Exercise isolated PostgreSQL workspace revocation
        id: sql_revocation
        run: npm run lab:workspace-revocation
      - name: Exercise isolated PostgreSQL workspace and store linking
        id: sql_linking
        run: npm run lab:workspace-store-linking
      - name: Exercise isolated PostgreSQL PKCE admission
        id: sql_pkce
        run: npm run lab:authentication-exchange
      - name: Exercise isolated PostgreSQL provider identity selection
        id: sql_selection
        run: npm run lab:provider-subject-resolution
      - name: Exercise isolated PostgreSQL browser session admission
        id: sql_admission
        run: npm run lab:browser-session-admission
      - name: Exercise isolated WorkOS operator with SQL and loopback only
        id: frozen71
        run: npm run lab:workos-operator
      - name: Exercise preserved74 WorkOS signature operator with synthetic providers only
        id: frozen74
        run: npm run lab:workos-operator-frozen74
      - name: Exercise preserved80 full authentication operator with synthetic providers only
        id: frozen80
        run: npm run lab:workos-authentication-operator
      - name: Exercise preserved82 full authentication operator with synthetic providers only
        id: frozen82
        run: npm run lab:workos-authentication-operator-current
      - name: Exercise actual browser request to workspace HTTP and PostgreSQL
        id: http_workspace
        run: npm run lab:standalone-workspace-http
      - name: Exercise private linking lookup and read-only reconciliation in PostgreSQL
        id: sql_link_read
        run: npm run lab:workspace-linking-read
      - name: Exercise actual authenticated controlled linking HTTP and PostgreSQL
        id: http_linking
        run: npm run lab:standalone-store-linking-http
      - name: Exercise isolated login custody, one-use claims and maintenance in PostgreSQL
        id: sql_custody
        run: npm run lab:login-flow-custody
      - name: Exercise local HTTPS login cookie to workspace and store linking
        id: https_login
        run: npm run lab:standalone-login-https
      - name: Exercise restricted current-family self-logout in PostgreSQL
        id: sql_logout
        run: npm run lab:self-logout-sql
      - name: Exercise local HTTPS logout and workspace/store-linking denial
        id: https_logout
        run: npm run lab:standalone-logout-https
      - name: Exercise fixed WorkOS wire to local HTTPS login and logout
        id: https_fixed_provider
        run: npm run lab:fixed-workos-login-https
      - name: Collect pending validation evidence
        id: validation_evidence_collect
        if: always()
        env:
          CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci-validation-evidence.mjs collect
      - name: Preserve fresh validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}/artifact
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 3
