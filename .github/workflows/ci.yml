name: Morrow foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm run smoke:scaffold
      - name: Exercise isolated PostgreSQL identity, rotation and quarantined restore
        run: |
          npm run lab:operations
          npm run lab:restore
          npm run lab:identity
          npm run lab:permissions
      - name: Validate regional CloudFormation templates without AWS credentials
        run: |
          python3 -m venv /tmp/morrow-cfn-validator
          /tmp/morrow-cfn-validator/bin/pip install --disable-pip-version-check -r infra/requirements-validation.txt
          /tmp/morrow-cfn-validator/bin/cfn-lint --regions us-east-1 --template work/infrastructure-templates/development.json work/infrastructure-templates/staging.json work/infrastructure-templates/production.json
