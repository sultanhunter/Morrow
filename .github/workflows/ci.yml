name: Morrow foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm run smoke:scaffold
      - name: Exercise identity and validators in the local Workers runtime
        run: npm run lab:workers
      - name: Exercise isolated PostgreSQL identity, rotation and quarantined restore
        run: |
          npm run lab:operations
          npm run lab:restore
          npm run lab:identity
          npm run lab:permissions
          npm run lab:authentication
