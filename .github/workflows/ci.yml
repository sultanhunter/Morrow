name: Morrow foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# P03.T04f: how much runs depends on the event, and `foundation` is the single required
# status check in every case.
# - A pull request runs everything, unless every file it changes is Markdown; then it runs
#   only `checks`, which holds every check that reads Markdown (plan:check, verify, the
#   unit tests). `scope` decides.
# - A push to main runs only `checks`. Each pull request merged only after a green full
#   run on its exact head, which already contained main (ADR-0014).
# - workflow_dispatch runs everything, on main or any branch.
# Every job that checks out the repository and writes reports routes them to
# MORROW_ARTIFACTS_DIR, secret-scans that directory, uploads it only when the scan
# passes, and ends by requiring an unchanged checkout. docs/development/ci.md describes
# the layout.
jobs:
  # Writes no report, so it has no scan, upload or clean-tree steps.
  scope:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run everything unless every file the pull request changes is Markdown
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '\.md$'; then full=false; fi
            echo "$(printf '%s\n' "$changed" | grep -c .) changed files"
          fi
          echo "event $EVENT_NAME, full=$full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Route reports outside the checkout
        run: echo "MORROW_ARTIFACTS_DIR=$RUNNER_TEMP/morrow-artifacts" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the repository tests, parallel-safe files concurrently, then the serial list
        run: npm test
      - name: Format, typecheck, verify, build, scaffold denial guards, lab example and infrastructure checks
        run: npm run ci:static
      - name: Secret-scan generated reports before upload
        id: artifact_scan
        if: always()
        run: node scripts/scan-artifacts.mjs "$MORROW_ARTIFACTS_DIR"
      - name: Upload generated reports
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-artifacts
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
      - name: Require an unchanged checkout
        if: always()
        run: git status --porcelain --untracked-files=all; test -z "$(git status --porcelain --untracked-files=all)"

  workers:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Route reports outside the checkout
        run: echo "MORROW_ARTIFACTS_DIR=$RUNNER_TEMP/morrow-artifacts" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the workspace SPA that the api Worker serves through Static Assets
        run: npm run build -w @morrow/workspace-web
      - name: Pull the pinned image that hosts the network-none edge checks
        run: docker pull "$(node -p 'require("./infra/local-engine.json").image')"
      # P04.T02a AC02/AC23: wrangler dry-runs all 12 Worker x environment bundles and
      # starts the unbound local dev pair with no network at all. The checkout is
      # mounted read-only (wrangler's .wrangler/ scratch directories are tmpfs) and the
      # runner's pinned Node 24.13.0 is mounted into the digest-pinned image.
      - name: Dry-run every Worker and smoke-test local dev inside a network-none container
        run: >-
          mkdir -p "$MORROW_ARTIFACTS_DIR" apps/api/.wrangler apps/broker/.wrangler apps/workers/.wrangler apps/shopify-connector/.wrangler &&
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)"
          --tmpfs /tmp:rw,exec,size=1024m
          --tmpfs /repo/apps/api/.wrangler:rw,exec,uid=$(id -u) --tmpfs /repo/apps/broker/.wrangler:rw,exec,uid=$(id -u)
          --tmpfs /repo/apps/workers/.wrangler:rw,exec,uid=$(id -u) --tmpfs /repo/apps/shopify-connector/.wrangler:rw,exec,uid=$(id -u)
          --volume "$PWD:/repo:ro" --volume "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro"
          --volume "$MORROW_ARTIFACTS_DIR:/artifacts" --workdir /repo
          --env PATH=/opt/node/bin:/usr/bin:/bin --env HOME=/tmp --env CI=true --env MORROW_ARTIFACTS_DIR=/artifacts
          --env npm_config_update_notifier=false --env npm_config_cache=/tmp/npm-cache
          --entrypoint /bin/sh "$(node -p 'require("./infra/local-engine.json").image')"
          -c 'npm run edge:dry-run && npm run smoke:edge-dev'
      - name: Exercise configured native workspace API and request-owned lifetime
        run: npm run lab:workspace-api-workers
      - name: Exercise the other Workers laboratories in the local Workers runtime, one at a time
        run: npm run lab:group:workers
      - name: Secret-scan generated reports before upload
        id: artifact_scan
        if: always()
        run: node scripts/scan-artifacts.mjs "$MORROW_ARTIFACTS_DIR"
      - name: Upload generated reports
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-artifacts
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
      - name: Require an unchanged checkout
        if: always()
        run: git status --porcelain --untracked-files=all; test -z "$(git status --porcelain --untracked-files=all)"

  # Each leg runs its lab groups one lab at a time. `core-http` holds the two shorter
  # groups, pg-core then pg-http, so one runner pays the setup and image pull once.
  postgres:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        leg: [core-http, linking, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Route reports outside the checkout
        run: echo "MORROW_ARTIFACTS_DIR=$RUNNER_TEMP/morrow-artifacts" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull the pinned PostgreSQL image
        run: docker pull "$(node -p 'require("./infra/local-engine.json").image')"
      - name: Record the isolated pinned PostgreSQL engine build
        if: matrix.leg == 'core-http'
        run: >-
          node --input-type=module --eval 'import {localPostgresLab} from "./scripts/local-postgres-lab.mjs"; await localPostgresLab("P04.engine-diagnostic", async ({image,version}) => console.log(JSON.stringify({image,version})));'
      - name: Exercise the pg-core laboratories, one at a time
        if: matrix.leg == 'core-http'
        run: npm run lab:group:pg-core
      - name: Exercise the pg-http laboratories, one at a time
        if: matrix.leg == 'core-http'
        run: npm run lab:group:pg-http
      - name: Exercise the pg-linking laboratories, one at a time
        if: matrix.leg == 'linking'
        run: npm run lab:group:pg-linking
      - name: Exercise the pg-work laboratories, one at a time
        if: matrix.leg == 'work'
        run: npm run lab:group:pg-work
      - name: Secret-scan generated reports before upload
        id: artifact_scan
        if: always()
        run: node scripts/scan-artifacts.mjs "$MORROW_ARTIFACTS_DIR"
      - name: Upload generated reports
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-${{ github.job }}-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-artifacts
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
      - name: Require an unchanged checkout
        if: always()
        run: git status --porcelain --untracked-files=all; test -z "$(git status --porcelain --untracked-files=all)"

  pgwire:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Route reports outside the checkout
        run: echo "MORROW_ARTIFACTS_DIR=$RUNNER_TEMP/morrow-artifacts" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull the pinned PostgreSQL image
        run: docker pull "$(node -p 'require("./infra/local-engine.json").image')"
      - name: Exercise controlled Neon, managed login, workspace API and the deployable api/broker over PG wire against isolated PostgreSQL
        run: npm run lab:group:pgwire
      - name: Secret-scan generated reports before upload
        id: artifact_scan
        if: always()
        run: node scripts/scan-artifacts.mjs "$MORROW_ARTIFACTS_DIR"
      - name: Upload generated reports
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-artifacts
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
      - name: Require an unchanged checkout
        if: always()
        run: git status --porcelain --untracked-files=all; test -z "$(git status --porcelain --untracked-files=all)"

  # P14.T01a: the provisional workspace UI. The bounded accessibility, keyboard and
  # contrast matrix on the fixture build and on the production dist, then the
  # real-browser sign-in journey against the configured harness and PostgreSQL 17.
  ui:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Route reports outside the checkout
        run: echo "MORROW_ARTIFACTS_DIR=$RUNNER_TEMP/morrow-artifacts" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull the pinned PostgreSQL image
        run: docker pull "$(node -p 'require("./infra/local-engine.json").image')"
      - name: Install the pinned Playwright Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Build the workspace SPA and the api Worker
        run: npm run build
      - name: Check the fixture build at 1440, 768, 390 and 320 pixels, with keyboard walks
        run: npm run ui:check
      - name: Check the production dist under the unbound dev pair
        run: npm run ui:edge
      - name: Sign in, enter and sign out in Chromium against the configured harness
        run: npm run lab:group:ui
      - name: Secret-scan generated reports before upload
        id: artifact_scan
        if: always()
        run: node scripts/scan-artifacts.mjs "$MORROW_ARTIFACTS_DIR"
      - name: Upload generated reports
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: morrow-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrow-artifacts
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90
      - name: Require an unchanged checkout
        if: always()
        run: git status --porcelain --untracked-files=all; test -z "$(git status --porcelain --untracked-files=all)"

  # Same name as the former single job, so the required status check is unchanged. It
  # runs on every event and fails unless `checks` succeeded and every lab job ended as
  # this event requires: success on a full run, skipped on a push to main or a
  # Markdown-only pull request. Any failed, cancelled or unexpectedly skipped job fails it.
  foundation:
    if: always()
    needs: [scope, checks, workers, postgres, pgwire, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job this event runs to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          CHECKS: ${{ needs.checks.result }}
          LABS: ${{ needs.workers.result }} ${{ needs.postgres.result }} ${{ needs.pgwire.result }} ${{ needs.ui.result }}
        run: |
          echo "event $EVENT_NAME, scope $SCOPE (full=$FULL), job results: $RESULTS"
          test -n "$RESULTS"
          test -n "$LABS"
          [ "$CHECKS" = success ] || { echo "required job checks: $CHECKS"; exit 1; }
          if [ "$EVENT_NAME" = push ] && [ "$SCOPE" = skipped ]; then mode=light
          elif [ "$EVENT_NAME" != push ] && [ "$SCOPE" = success ] && [ "$FULL" = true ]; then mode=full
          elif [ "$EVENT_NAME" = pull_request ] && [ "$SCOPE" = success ] && [ "$FULL" = false ]; then mode=light
          else echo "required job scope: $SCOPE (full=$FULL) on $EVENT_NAME"; exit 1; fi
          if [ "$mode" = full ]; then want=success; else want=skipped; fi
          for r in $LABS; do [ "$r" = "$want" ] || { echo "lab job: $r, a $mode run requires $want"; exit 1; }; done
          echo "foundation: $mode run"
